<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News</title>
<style>
  :root {
    --bg: #f4f4f1; --surface: #ffffff; --text: #1b1b1a; --muted: #6b6a66;
    --chip: #e6e5e0; --chip-on: #1b1b1a; --chip-on-text: #ffffff; --shade: rgba(0, 0, 0, 0.62);
    --world: #3d6e8f; --us: #8a4b3c; --politics: #6b4f8a; --business: #3f7a5a; --science: #2f6f7a;
    --tech: #4a5a8a; --health: #8a3f5a; --climate: #5a7a3f; --arts: #8a6a35; --other: #6b6a66;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --surface: #1f1f1d; --text: #ecebe6; --muted: #9b9a94;
      --chip: #2c2c29; --chip-on: #ecebe6; --chip-on-text: #141413;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { max-width: 1280px; margin: 0 auto; padding: 20px 16px 8px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  #updated { color: var(--muted); font-size: 13px; }
  #chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { border: 0; border-radius: 999px; padding: 6px 14px; background: var(--chip);
          color: var(--text); font: inherit; font-size: 13px; cursor: pointer; text-transform: capitalize; }
  .chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-text); }
  main { max-width: 1280px; margin: 0 auto; padding: 8px 16px 24px; display: grid; gap: 12px;
         grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); grid-auto-rows: 190px;
         grid-auto-flow: dense; }
  .tile { position: relative; overflow: hidden; border-radius: 10px; background: var(--other);
          color: #fff; text-decoration: none; display: flex; flex-direction: column; justify-content: flex-end; }
  .tile.large { grid-column: span 2; grid-row: span 2; }
  .tile.medium { grid-column: span 2; }
  .tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .tile .text { position: relative; padding: 12px 14px;
                background: linear-gradient(transparent, var(--shade) 35%); }
  .tile h2 { margin: 0; font-size: 16px; line-height: 1.3; font-weight: 600; }
  .tile.large h2 { font-size: 24px; }
  .tile .meta { margin-top: 6px; font-size: 12px; opacity: 0.9; }
  .tile:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
  #empty { color: var(--muted); padding: 40px 0; text-align: center; grid-column: 1 / -1; }
  footer { max-width: 1280px; margin: 0 auto; padding: 8px 16px 32px; color: var(--muted); font-size: 12px; }
  footer a { color: inherit; }
  @media (max-width: 600px) {
    main { grid-template-columns: 1fr; grid-auto-rows: 200px; }
    .tile.large, .tile.medium { grid-column: span 1; grid-row: span 1; }
    .tile.large h2 { font-size: 18px; }
  }
</style>
</head>
<body>
<header>
  <h1>News</h1>
  <div id="updated"></div>
  <div id="chips" role="group" aria-label="Filter by topic"></div>
</header>
<main id="grid"></main>
<footer>
  Articles found through <a href="https://www.gdeltproject.org/">The GDELT Project</a>.
  Unreliable sites removed using the <a href="https://iffy.news/index/">Iffy.news Index of Unreliable Sources</a>
  (<a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>).
  Headlines, descriptions and images belong to their publishers; every tile links to the original article.
</footer>
<script>
  // All text from news.json goes in with textContent, never innerHTML: headlines come
  // from thousands of websites, and inserting them as HTML would let one run code here.
  let stories = [];
  let topic = "all";

  function ago(iso) {
    const minutes = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 60000));
    if (minutes < 60) return minutes + " min ago";
    const hours = Math.round(minutes / 60);
    return hours < 24 ? hours + " h ago" : Math.round(hours / 24) + " d ago";
  }

  function safeUrl(url) {
    try { const u = new URL(url); return u.protocol === "https:" || u.protocol === "http:" ? u.href : null; }
    catch { return null; }
  }

  function tile(story, size) {
    const a = document.createElement("a");
    a.className = "tile " + size;
    a.href = safeUrl(story.url) || "#";
    a.target = "_blank";
    a.rel = "noopener";
    a.style.background = "var(--" + story.topic + ", var(--other))";

    const img = safeUrl(story.image);
    if (img) {
      const el = document.createElement("img");
      el.src = img;
      el.alt = "";
      el.loading = "lazy";
      el.referrerPolicy = "no-referrer";
      el.onerror = () => el.remove();   // broken image: the topic colour shows instead
      a.append(el);
    }
    const text = document.createElement("div");
    text.className = "text";
    const h = document.createElement("h2");
    h.textContent = story.title;
    const meta = document.createElement("div");
    meta.className = "meta";
    const others = story.outlet_count - 1;
    meta.textContent = [story.outlet, ago(story.published_at), others > 0 ? "+" + others + " outlets" : ""]
      .filter(Boolean).join(" · ");
    if (story.also_reported_by.length) {
      meta.title = "Also reported by " + story.also_reported_by.map(x => x.outlet).join(", ");
    }
    text.append(h, meta);
    a.append(text);
    return a;
  }

  function render() {
    const grid = document.getElementById("grid");
    const shown = stories.filter(s => topic === "all" || s.topic === topic);
    grid.replaceChildren(...shown.map((s, i) => tile(s, i < 2 ? "large" : i < 6 ? "medium" : "small")));
    if (!shown.length) {
      const p = document.createElement("p");
      p.id = "empty";
      p.textContent = "No stories yet.";
      grid.append(p);
    }
    for (const chip of document.querySelectorAll(".chip")) {
      chip.setAttribute("aria-pressed", String(chip.dataset.topic === topic));
    }
  }

  function chips() {
    const topics = ["all", ...new Set(stories.map(s => s.topic))];
    const box = document.getElementById("chips");
    box.replaceChildren(...topics.map(t => {
      const b = document.createElement("button");
      b.className = "chip";
      b.dataset.topic = t;
      b.textContent = t === "us" ? "US" : t;
      b.onclick = () => { topic = t; render(); };
      return b;
    }));
  }

  fetch("news.json", { cache: "no-store" })
    .then(r => r.json())
    .then(data => {
      stories = data.stories;
      document.getElementById("updated").textContent = "Updated " + ago(data.generated_at) +
        " · " + stories.length + " stories";
      chips();
      render();
    })
    .catch(() => { document.getElementById("updated").textContent = "Could not load news.json."; });
</script>
</body>
</html>
