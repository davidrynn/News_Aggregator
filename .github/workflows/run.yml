# One pipeline run on GitHub's machines: load state, run and publish, save state.
# Free for a public repo; the only cost is the DeepInfra calls (~$0.03 a run).
# Needs the repo secret DEEPINFRA_API_KEY (Settings > Secrets and variables > Actions).
name: run

on:
  schedule:
    - cron: "0 11 * * *"   # once a day (owner decision 2026-10-27): 7:00 New York in summer, 6:00 in winter
  workflow_dispatch:       # the "Run workflow" button on the Actions tab

concurrency:
  group: newsagg           # never two runs at once: the second waits
  cancel-in-progress: false

permissions:
  contents: write          # push gh-pages and state

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
      PYTHONIOENCODING: utf-8
      # commit-tree needs a name for the gh-pages and state commits
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: pip install -r requirements.lock.txt
      - run: python -m newsagg load-state
      - run: python -m newsagg run --publish
      # Only after a good run: a failed one leaves the last good state for the next try.
      - run: python -m newsagg save-state
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ github.run_number }}
          path: logs/
          retention-days: 30
